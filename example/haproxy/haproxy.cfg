# https://docs.haproxy.org/
global
    log stdout format raw local0

defaults
    log global
    option httplog
    timeout client 1m
    timeout server 1m
    timeout connect 10s

frontend default
    mode http
    bind *:80
    log-format "%ci:%cp\ [%t]\ %ft\ %b/%s\ %Th/%Ti/%TR/%Tq/%Tw/%Tc/%Tr/%Tt\ %ST\ %B\ %CC\ %CS\ %tsc\ %ac/%fc/%bc/%sc/%rc\ %sq/%bq\ %hr\ %hs\ %{+Q}r\ %[var(txn.coraza.id)]\ spoa-error:\ %[var(txn.coraza.error)]\ waf-hit:\ %[var(txn.coraza.status)]\ ruleid:\ %[var(txn.coraza.ruleid)]\ rules-hit:\ %[var(txn.coraza.rules_hit)]"

    # Emulate Apache behavior by only allowing http 1.0, 1.1, 2.0 
    http-request deny deny_status 400 if !HTTP
    http-request deny deny_status 400 if !HTTP_1.0 !HTTP_1.1 !HTTP_2.0

    # Set coraza app in HAProxy config to allow customized configs per host.
    # You can also just leave this as is or even replace the use of a variable
    # inside the coraza.cfg.
    http-request set-var(txn.coraza.app) str(sample_app)

    # Initialize all auto-ban variables so a multi-message integration cannot
    # reuse a stale decision. The SPOA fills them on every request.
    http-request set-var(txn.coraza.autoban_action) str(none)
    http-request set-var(txn.coraza.autoban_would_action) str(none)
    http-request set-var(txn.coraza.autoban_policy) str()
    http-request set-var(txn.coraza.autoban_scope) str()
    http-request set-var(txn.coraza.autoban_until) int(0)
    http-request set-var(txn.coraza.autoban_retry_after) int(0)
    http-request set-var(txn.coraza.policy_degraded) bool(false)
    http-request set-var(txn.coraza.autoban_request_id) str()

    # !! Every http-request line will be executed before this !!
    # Execute coraza request check.
    filter spoe engine coraza config /usr/local/etc/haproxy/coraza.cfg
    http-request send-spoe-group coraza coraza-req

    # Currently haproxy cannot use variables to set the code or deny_status, so this needs to be manually configured here
    http-request redirect code 302 location %[var(txn.coraza.data)] if { var(txn.coraza.action) -m str redirect }
    http-response redirect code 302 location %[var(txn.coraza.data)] if { var(txn.coraza.action) -m str redirect }

    http-request deny deny_status 403 hdr waf-block "request"  if { var(txn.coraza.action) -m str deny }
    http-response deny deny_status 403 hdr waf-block "response" if { var(txn.coraza.action) -m str deny }

    http-request silent-drop if { var(txn.coraza.action) -m str drop }
    http-response silent-drop if { var(txn.coraza.action) -m str drop }

    # Deny in case of an error, when processing with the Coraza SPOA
    http-request deny deny_status 500 if { var(txn.coraza.error) -m int gt 0 }
    http-response deny deny_status 500 if { var(txn.coraza.error) -m int gt 0 }

    # Optional cluster auto-ban enforcement. The general example keeps auto-ban
    # disabled, so these variables are always none/empty. See example/autoban/.
    http-request deny deny_status 429 hdr Retry-After %[var(txn.coraza.autoban_retry_after)] if { var(txn.coraza.autoban_action) -m str throttle }
    http-request deny deny_status 403 if { var(txn.coraza.autoban_action) -m str ban }

    use_backend httpbin_backend

resolvers host_dns
    parse-resolv-conf

backend httpbin_backend
    mode http
    server backend $BACKEND_HOST

backend coraza-spoa
    option spop-check
    mode tcp
    server coraza_spoa coraza-spoa:9000 check
