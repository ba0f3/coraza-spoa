name: autoban

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cluster:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        haproxy: ["2.8", "3.0", "3.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: Syntax-check HAProxy configs
        run: |
          for cfg in integration/autoban/haproxy-a.cfg integration/autoban/haproxy-b.cfg; do
            docker run --rm -v "$PWD/integration/autoban:/usr/local/etc/haproxy:ro" \
              "haproxy:${{ matrix.haproxy }}-alpine" haproxy -c -f "/usr/local/etc/haproxy/$(basename "$cfg")"
          done
      - name: Run cluster integration tests
        env:
          AUTOBAN_HAPROXY_VERSION: ${{ matrix.haproxy }}
        run: ./integration/autoban/run.sh
