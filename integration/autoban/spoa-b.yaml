bind: ":9000"
default_application: cluster_app
log_level: info
log_file: /dev/stdout
log_format: json

autoban:
  enabled: true
  mode: enforce
  on_store_error: continue_waf
  redis:
    addresses: [redis:6379]
    key_prefix: cluster-it
  operation_timeout: 20ms
  request_store_budget: 50ms
  max_concurrent_operations: 128
  admin_socket: /tmp/autoban-admin.sock

applications:
  - name: cluster_app
    directives: |
      Include @coraza.conf-recommended
      Include @crs-setup.conf.example
      Include @owasp_crs/*.conf
      SecRule REQUEST_FILENAME "@streq /get" "id:190100,phase:1,pass,nolog,t:none,tag:'autoban/secret-probe',msg:'Secret file probe'"
      SecRuleRemoveById 920350 920420
      SecRuleEngine On
    response_check: false
    transaction_ttl_ms: 60000
    log_level: info
    log_file: /dev/stdout
    log_format: json
    autoban:
      enabled: true
      policies:
        - id: secret-probe
          enabled: true
          type: match
          rule_ids: [190100]
          window: 60s
          threshold: 3
          ban_for: 60s
        - id: login-rate
          enabled: true
          type: rate
          methods: [POST]
          path_exact: [/post]
          requests: 20
          period: 10s
          burst: 10
