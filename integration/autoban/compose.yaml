services:
  redis:
    image: redis:7.2
    command:
      - redis-server
      - --bind
      - 0.0.0.0
      - --port
      - "16379"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:16379:16379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16379", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
